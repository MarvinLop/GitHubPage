<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUB Repaso 3.º DS «B» · Día 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <span class="header-badge">INDEL · 3.º DS «B» · Día 2 de 3</span>
    <h1>Portal de Repaso 2026</h1>
    <p>Desarrollado por Marvin · Todos los módulos oficiales</p>
  </header>

  <main>
    <!-- Barra de Búsqueda y Filtros -->
    <div class="controls-bar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar módulo o tecnología..." aria-label="Buscar módulos">
      </div>
      <div class="filter-chips">
        <button class="chip-btn active" data-filter="all">Todos</button>
        <button class="chip-btn" data-filter="Javier Mineros">Profe Javier</button>
        <button class="chip-btn" data-filter="Arcides Canales">Profe Arcides</button>
      </div>
    </div>

    <!-- Contenedor dinámico -->
    <section class="grid-modulos" id="modulosContainer">
      <!-- Se pinta dinámicamente con JS -->
    </section>
  </main>

  <!-- Ventana Modal de Ficha -->
  <dialog id="fichaModal">
    <div class="modal-header">
      <h2 id="modalTitle">Nombre del Módulo</h2>
      <button class="btn-close" id="btnCloseModal" aria-label="Cerrar">&times;</button>
    </div>
    <div id="modalBody"></div>
  </dialog>

  <!-- Scripts -->
  <script src="js/modulos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
